<!doctype html>
<html lang="en">
  <head>

    <script src="https://cdn.tailwindcss.com"></script>

      tailwind.config = {
        theme: {

                100: '#ffe4e6',
                200: '#fecdd3',
                300: '#fda4af',
                400: '#fb7185',
                500: '#f43f5e',
                600: '#e11d48',
                700: '#be123c',
                800: '#9f1239',
                900: '#881337',
                950: '#4c0519',

              champagne: {
                100: '#fdf6e9',
                200: '#f8e7c9',
                300: '#f2d49e',
                400: '#eabf70',
                500: '#dfa646',
                600: '#c5872f',
              },
              wine: {
                800: '#4a0e2e',
                900: '#340820',
                950: '#200313',
              }
            },
            fontFamily: {
              script: ['"Great Vibes"', 'cursive'],
              serif: ['"Playfair Display"', 'serif'],

      }
      .font-romantic {
        font-family: 'Great Vibes', cursive;
      }
      .font-editorial {
        font-family: 'Playfair Display', serif;
      }
      /* Custom Romantic Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #fdf2f8;
      }
      ::-webkit-scrollbar-thumb {
        background: #fda4af;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #f43f5e;
      }
